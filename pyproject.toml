[project]
name = "hh-career"
version = "0.1.0"
description = "Поиск подходящих вакансий на hh.ru и отклики через Telegram"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "aiogram>=3.13",
    "openai>=1.50",
    "aiosqlite>=0.20",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
hh-career = "hh_career.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
